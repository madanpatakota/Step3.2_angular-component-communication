<div class="container mt-5">
  <div class="card shadow-sm">

    <div class="card-header bg-primary text-white">
      <i class="bi bi-phone me-2"></i>
      Parent Component – Message Receiver
    </div>

    <div class="card-body">

      <!--
        Parent listens to events emitted by the child.

        traditionalEmployeeAction:
        Child @Output() event.

        modernEmployeeAction:
        Child output() event.

        $event contains the message emitted by the child.
      -->
      <app-output-child
        (traditionalEmployeeAction)="receiveTraditionalOutput($event)"
        (modernEmployeeAction)="receiveModernOutput($event)">
      </app-output-child>

      <div class="row mt-4">

        <!-- Parent receives @Output() message here -->
        <div class="col-md-6 mb-3">
          <div class="card border-primary h-100">

            <div class="card-header bg-primary text-white">
              <i class="bi bi-phone-vibrate me-2"></i>
              Parent Phone – @Output()
            </div>

            <div class="card-body">
              <p class="text-muted">
                Message received from the child:
              </p>

              <div class="alert alert-primary mb-0">
                <i class="bi bi-chat-left-text me-2"></i>
                {{ traditionalMessage }}
              </div>
            </div>

          </div>
        </div>

        <!-- Parent receives output() message here -->
        <div class="col-md-6 mb-3">
          <div class="card border-success h-100">

            <div class="card-header bg-success text-white">
              <i class="bi bi-phone-vibrate me-2"></i>
              Parent Phone – output()
            </div>

            <div class="card-body">
              <p class="text-muted">
                Message received from the child:
              </p>

              <div class="alert alert-success mb-0">
                <i class="bi bi-chat-left-text me-2"></i>
                {{ modernMessage }}
              </div>
            </div>

          </div>
        </div>

      </div>
    </div>
  </div>
</div>
